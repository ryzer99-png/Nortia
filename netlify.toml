[build]
  command = "npm run build"
  publish = "dist"

# Redirecciones automáticas para URLs antiguas (.html -> limpias)
[[redirects]]
  from = "/home.html"
  to = "/hogar"
  status = 301

[[redirects]]
  from = "/mobility.html"
  to = "/movilidad"
  status = 301

[[redirects]]
  from = "/life.html"
  to = "/personas"
  status = 301

[[redirects]]
  from = "/business.html"
  to = "/empresas"
  status = 301

